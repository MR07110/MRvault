<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#050508">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>MRtube</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg width='32' height='32' viewBox='0 0 32 32' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath fill='%233A86F4' d='M29.41,9.26a3.5,3.5,0,0,0-2.47-2.47C24.76,6.2,16,6.2,16,6.2s-8.76,0-10.94.59A3.5,3.5,0,0,0,2.59,9.26,36.13,36.13,0,0,0,2,16a36.13,36.13,0,0,0,.59,6.74,3.5,3.5,0,0,0,2.47,2.47C7.24,25.8,16,25.8,16,25.8s8.76,0,10.94-.59a3.5,3.5,0,0,0,2.47-2.47A36.13,36.13,0,0,0,30,16,36.13,36.13,0,0,0,29.41,9.26Z'/%3E%3Cpolygon fill='white' points='13.2,11.8 13.2,20.2 20.47,16'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
</head>
<body>

<!-- SPLASH -->
<div id="splash">
  <div class="splash-inner">
    <div class="splash-logo-wrap">
      <img class="splash-svg" src="./splash.svg" alt="Logo" width="128" height="128">
    </div>
    <div class="splash-wordmark">MRtube</div>
    <div class="splash-sub">PRIVATE MEDIA</div>
    <div class="splash-bar"><div class="splash-fill"></div></div>
  </div>
</div>

<!-- AUTH -->
<div id="authWrap">
  <div class="auth-card">
    <div class="auth-logo">
      <svg width="28" height="28" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
        <path fill="#3A86F4" d="M29.41,9.26a3.5,3.5,0,0,0-2.47-2.47C24.76,6.2,16,6.2,16,6.2s-8.76,0-10.94.59A3.5,3.5,0,0,0,2.59,9.26,36.13,36.13,0,0,0,2,16a36.13,36.13,0,0,0,.59,6.74,3.5,3.5,0,0,0,2.47,2.47C7.24,25.8,16,25.8,16,25.8s8.76,0,10.94-.59a3.5,3.5,0,0,0,2.47-2.47A36.13,36.13,0,0,0,30,16,36.13,36.13,0,0,0,29.41,9.26Z"/>
        <polygon fill="white" points="13.2,11.8 13.2,20.2 20.47,16"/>
      </svg>
      <span class="auth-brand">MRtube</span>
    </div>
    <div class="auth-title" id="authTitle">Sign in to your account</div>
    <div id="nameRow" style="display:none"><input class="field" type="text" id="aFullname" placeholder="Full name"></div>
    <input class="field" type="text"     id="aUsername" placeholder="Username (min 3 chars)" autocomplete="username">
    <input class="field" type="password" id="aPassword" placeholder="Password (min 6 chars)"   autocomplete="current-password">
    <div id="confirmRow" style="display:none"><input class="field" type="password" id="aConfirm" placeholder="Confirm password"></div>
    <div class="err-msg" id="authErr"></div>
    <button class="btn-primary" id="authBtn">Sign in</button>
    <div class="auth-switch">
      <span id="authSwitchText">No account? </span>
      <span class="auth-link" id="authSwitchBtn">Sign up</span>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <!-- HEADER -->
  <header class="app-hdr" id="appHdr">
    <div class="hdr-logo">
      <svg width="26" height="26" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
        <path fill="#3A86F4" d="M29.41,9.26a3.5,3.5,0,0,0-2.47-2.47C24.76,6.2,16,6.2,16,6.2s-8.76,0-10.94.59A3.5,3.5,0,0,0,2.59,9.26,36.13,36.13,0,0,0,2,16a36.13,36.13,0,0,0,.59,6.74,3.5,3.5,0,0,0,2.47,2.47C7.24,25.8,16,25.8,16,25.8s8.76,0,10.94-.59a3.5,3.5,0,0,0,2.47-2.47A36.13,36.13,0,0,0,30,16,36.13,36.13,0,0,0,29.41,9.26Z"/>
        <polygon fill="white" points="13.2,11.8 13.2,20.2 20.47,16"/>
      </svg>
      <span class="hdr-brand">MRtube</span>
    </div>
    <div class="hdr-search">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#55555f" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="searchInput" placeholder="Search...">
    </div>
    <div class="hdr-tabs">
      <button class="hdr-tab on" data-tab="all">All</button>
      <button class="hdr-tab"    data-tab="mine">My</button>
    </div>
  </header>

  <!-- VIEWS -->
  <div class="view on" id="homeView">
    <div class="feed" id="feed"><div class="spin-wrap"><div class="spinner"></div></div></div>
  </div>

  <div class="view" id="reelsView">
    <div class="reels-wrap" id="reelsWrap"></div>
  </div>

  <div class="view" id="followingView">
    <div class="feed" id="followingFeed"><div class="spin-wrap"><div class="spinner"></div></div></div>
  </div>

  <div class="view" id="profileView">
    <div class="profile-hdr">
      <div class="profile-top">
        <div class="profile-avi" id="profileAvi">
          <div class="avi-edit-badge">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
          </div>
        </div>
        <div class="profile-stats">
          <div class="stat"><div class="stat-val" id="statPosts">0</div><div class="stat-lbl">posts</div></div>
          <div class="stat"><div class="stat-val" id="statLikes">0</div><div class="stat-lbl">likes</div></div>
          <div class="stat"><div class="stat-val" id="statFollowers">0</div><div class="stat-lbl">followers</div></div>
          <div class="stat"><div class="stat-val" id="statFollowing">0</div><div class="stat-lbl">following</div></div>
        </div>
      </div>
      <div class="profile-name" id="profileName"></div>
      <div class="profile-bio"  id="profileBio"></div>
      <button class="edit-btn" id="editProfileBtn">Edit Profile</button>
    </div>
    <div class="profile-grid" id="profileGrid"></div>
  </div>

  <!-- BOTTOM NAV -->
  <nav class="bot-nav">
    <button class="nav-btn on" data-v="home">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>Home</span>
    </button>
    <button class="nav-btn" data-v="reels">
      <svg viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="m10 8 6 4-6 4V8z"/></svg>
      <span>Reels</span>
    </button>
    <button class="nav-center-btn" id="createBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
    <button class="nav-btn" data-v="following">
      <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span>Following</span>
    </button>
    <button class="nav-btn" data-v="profile">
      <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span>Profile</span>
    </button>
  </nav>
</div>

<!-- UPLOAD SHEET -->
<div class="overlay" id="uploadOverlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">New Post</div>
    <div class="upload-drop" id="uploadDrop">
      <div class="upload-drop-icon">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      </div>
      <div class="upload-drop-text">Select or drop a file</div>
      <div class="upload-drop-sub">Image · Video · PDF · DOC · TXT · ZIP</div>
      <input type="file" id="fileInput" style="display:none" accept="image/*,video/*,.pdf,.doc,.docx,.txt,.zip,.rar">
    </div>
    <div id="previewArea" style="display:none"></div>
    <textarea class="ta" id="captionInput" rows="3" placeholder="Add a caption... (optional)"></textarea>
    <div class="visibility-row">
      <div>
        <div class="visibility-label">Public</div>
        <div class="visibility-desc" id="visDesc">Only you can see this</div>
      </div>
      <label class="toggle">
        <input type="checkbox" id="pubToggle">
        <div class="toggle-track"></div>
      </label>
    </div>
    <div class="size-limit" id="sizeWarn" style="color:var(--red)"></div>
    <button class="btn-primary" id="uploadBtn" disabled>Post</button>
    <button class="btn-ghost"   id="cancelUpload">Cancel</button>
  </div>
</div>

<!-- COMMENTS MODAL -->
<div class="overlay" id="cmtModal">
  <div class="sheet" style="display:flex;flex-direction:column;max-height:82dvh;padding-bottom:max(env(safe-area-inset-bottom,0px),12px)">
    <div class="sheet-handle"></div>
    <div class="cmt-modal-hdr">
      <span class="cmt-modal-title">Comments</span>
      <button class="cmt-modal-close" id="cmtModalClose">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="cmt-modal-list" id="cmtModalList"></div>
    <div class="cmt-input-row">
      <input class="cmt-input" id="cmtModalInput" placeholder="Write a comment...">
      <button class="cmt-send" id="cmtModalSend">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </div>
</div>

<!-- REEL CAPTION SHEET -->
<div class="overlay" id="reelCapSheet">
  <div class="sheet" style="padding-bottom:max(env(safe-area-inset-bottom,0px),20px)">
    <div class="sheet-handle"></div>
    <div class="rcap-user-row" id="rcapUserRow"></div>
    <div class="rcap-text" id="rcapText"></div>
  </div>
</div>

<!-- PROFILE EDIT -->
<div class="overlay" id="profileEditOverlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">Edit Profile</div>
    <input class="field" type="text" id="editName"     placeholder="Full name">
    <textarea class="ta" id="editBioInput" rows="2"    placeholder="Bio..."></textarea>
    <button class="btn-primary" id="saveProfileBtn">Save</button>
    <button class="btn-ghost"   id="cancelEditBtn">Cancel</button>
    <div class="divider" style="margin:12px 0"></div>
    <button class="btn-danger"  id="logoutBtn">Sign out</button>
  </div>
</div>

<!-- ZOOM MODAL -->
<div id="zoomModal">
  <button class="zoom-x" id="zoomClose">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
  </button>
  <img   id="zoomImg"   style="display:none">
  <video id="zoomVideo" controls style="display:none"></video>
</div>

<!-- DETAIL MODAL -->
<div id="detailModal">
  <button class="detail-back" id="detailBack">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M19 12H5m7-7-7 7 7 7"/></svg>
  </button>
  <div id="detailContent"></div>
</div>

<!-- USER PROFILE MODAL -->
<div id="userProfileModal">
  <button class="up-back" id="upBack">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M19 12H5m7-7-7 7 7 7"/></svg>
  </button>
  <div class="up-body" id="upBody"></div>
</div>

<!-- CUSTOM CONFIRM MODAL -->
<div class="overlay" id="confirmOverlay">
  <div class="sheet" style="max-width:320px;margin:auto">
    <div class="sheet-title" id="confirmTitle">Are you sure?</div>
    <div id="confirmMsg" style="font-size:14px;color:var(--text2);margin-bottom:20px;text-align:center"></div>
    <button class="btn-danger" id="confirmOkBtn">Confirm</button>
    <button class="btn-ghost"  id="confirmCancelBtn">Cancel</button>
  </div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<script type="module" src="./script.js"></script>
</body>
</html>
