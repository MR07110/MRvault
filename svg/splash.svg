<svg width="128px" height="128px" viewBox="0 0 32 32" id="icon" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      /* Shaklni yo'qotmaydigan, lekin o'ta elastik (Jelly-smooth) harakat */
      @keyframes funnyElastic2s {
        0%, 100% { 
          transform: scale(1) rotate(0deg); 
        }
        20% { 
          transform: scale(1.12, 0.92) rotate(-4deg); /* Eniga yengil yoyilish (Anticipation) */
        }
        40% { 
          transform: scale(0.92, 1.08) rotate(3deg);  /* Bo'yiga cho'zilish (Overshoot) */
        }
        60% { 
          transform: scale(1.04, 0.97) rotate(-1deg); /* Kamayuvchi elastik tebranish */
        }
        80% { 
          transform: scale(0.99, 1.01) rotate(0.5deg); 
        }
      }
      
      /* Play tugmasining ichkarida fonga teskari ravishda elastik tebranishi */
      @keyframes playElastic {
        0%, 100% { 
          transform: scale(1) translate(0, 0); 
        }
        30% { 
          transform: scale(0.85) translate(-0.5px, 0.5px); 
        }
        60% { 
          transform: scale(1.15) translate(1px, -0.5px); 
        }
      }

      .bg-color { 
        fill: #3A86F4; 
        transform-origin: center;
        /* 2 soniyalik sikl va maxsus silliq cubic-bezier trayektoriyasi */
        animation: funnyElastic2s 2s cubic-bezier(0.25, 1, 0.5, 1) infinite;
      }
      
      .play-icon { 
        fill: #FFFFFF; 
        transform-origin: 16px 16px;
        animation: playElastic 2s cubic-bezier(0.25, 1, 0.5, 1) infinite;
      }
      
      .cls-1 { fill: none; }
    </style>
  </defs>
  <title>logo--youtube-funny-elastic</title>
  
  <path class="bg-color" d="M29.41,9.26a3.5,3.5,0,0,0-2.47-2.47C24.76,6.2,16,6.2,16,6.2s-8.76,0-10.94.59A3.5,3.5,0,0,0,2.59,9.26,36.13,36.13,0,0,0,2,16a36.13,36.13,0,0,0,.59,6.74,3.5,3.5,0,0,0,2.47,2.47C7.24,25.8,16,25.8,16,25.8s8.76,0,10.94-.59a3.5,3.5,0,0,0,2.47-2.47A36.13,36.13,0,0,0,30,16,36.13,36.13,0,0,0,29.41,9.26Z"/>
  
  <polygon class="play-icon" points="13.2,11.8 13.2,20.2 20.47,16"/>
  
  <rect id="_Transparent_Rectangle_" data-name="&lt;Transparent Rectangle&gt;" class="cls-1" width="32" height="32"/>
</svg>
